name: Design consolidation static validation
on:
  push:
    branches:
      - integration/design-into-custom-apps-20261102
  pull_request:
    paths:
      - "marina_custom_apps/design_management/**"
      - "marina_custom_apps/marina_design_management/**"
      - "marina_custom_apps/hooks.py"
      - "marina_custom_apps/modules.txt"
      - "tests/test_design_consolidation.py"
      - "tests/test_independent_workspaces.py"
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m compileall -q marina_custom_apps
      - name: JavaScript syntax
        run: find marina_custom_apps/marina_design_management marina_custom_apps/public/js -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Consolidation / workspace contracts
        run: |
          python -m unittest discover -s tests -p 'test_design_consolidation.py'
          python -m unittest discover -s tests -p 'test_independent_workspaces.py'
          python -m unittest discover -s tests/design_management -p 'test_design_cost_breakdown.py'
          python -m unittest discover -s tests/design_management -p 'test_cost_approval_cancellation.py'
          python -m unittest discover -s tests/design_management -p 'test_cost_breakdown_role_migration.py'
