name: Bank GL typing-only Match numbers v0.53.19
on:
  push:
    branches: [bank-match-typing-v0.53.19, main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Match input regression checks
        run: |
          node --check marina_custom_apps/pos_reconciliation/doctype/bank_statement_reconciliation/bank_statement_reconciliation.js
          python - <<'PY'
          from pathlib import Path
          s=Path("marina_custom_apps/pos_reconciliation/doctype/bank_statement_reconciliation/bank_statement_reconciliation.js").read_text()
          assert s.count('type="text" inputmode="numeric" pattern="[1-9][0-9]{0,5}" maxlength="6"') == 2
          assert 'type="number" min="1" max="999999"' not in s
          assert 'raw.replace(/\\D/g, "").slice(0, 6)' in s
          assert 'const pattern = /^[1-9][0-9]{0,5}$/;' in s
          assert 'bsr_collect_match_inputs(frm)' in s
          assert 'bsr_build_manual_matches(bankRows, glRows' in s
          assert '0.53.19' in Path('pyproject.toml').read_text()
          assert '0.53.19' in Path('marina_custom_apps/__init__.py').read_text()
          print("Typing-only Match # fields and manual matching validations passed")
          PY
