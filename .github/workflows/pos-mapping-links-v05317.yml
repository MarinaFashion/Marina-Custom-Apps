name: POS mapping rerun and source links v0.53.17
on:
  push:
    branches: [pos-mapping-links-v0.53.17, main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and mapping classification safety
        run: |
          python -m compileall -q marina_custom_apps/pos_reconciliation
          node --check marina_custom_apps/pos_reconciliation/doctype/pos_reconciliation_run/pos_reconciliation_run.js
          python - <<'PY'
          import ast
          from pathlib import Path
          class Row(dict):
              __getattr__ = dict.get
          src=Path('marina_custom_apps/pos_reconciliation/reconciliation_engine.py').read_text()
          tree=ast.parse(src)
          names={'_protected_change_details','_material_change','_value_equal'}
          ns={'cstr':lambda x: '' if x is None else str(x)}
          exec(compile(ast.Module(body=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in names],type_ignores=[]),'<subset>','exec'),ns)
          old=Row(bank_transaction='B1',alhamrani_transaction='A1',bank_amount=100,alhamrani_amount=100,bank_commission_amount=2,bank_commission_vat_amount=.3,settlement_number='S1',settlement_date='2026-10-01',bank_settlement_amount=97.7,card_type='Unknown',terminal_id='T1',discrepancy_fields='Card Type',match_status='Discrepancy')
          base=dict(old)
          def check(changes, blocked):
              new=base.copy();new.update(changes)
              assert ns['_material_change'](old,new) is blocked, changes
          check({'card_type':'Visa','discrepancy_fields':'','match_status':'Matching Not Settled'},False)
          check({'card_type':'Visa'},False)
          check({'card_type':'Visa','discrepancy_fields':'Card Type, Amount'},True)
          check({'bank_amount':101},True)
          check({'bank_transaction':'B2'},True)
          check({'alhamrani_transaction':'A2'},True)
          check({'bank_commission_vat_amount':1},True)
          check({'settlement_number':'S2'},True)
          check({'match_status':'Bank Only - Not Settled'},True)
          js=Path('marina_custom_apps/pos_reconciliation/doctype/pos_reconciliation_run/pos_reconciliation_run.js').read_text()
          assert 'target="_blank" rel="noopener noreferrer"' in js
          assert 'href="#" class="pos-recon-doc-link"' not in js
          assert '"/app/" + encodeURIComponent(route)' in js
          assert 'frappe.set_route("Form", doctype, name)' not in js
          assert "0.53.18" in Path("pyproject.toml").read_text()
          print('Classification safety and direct-link checks passed')
          PY
